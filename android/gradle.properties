org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
android.useAndroidX=true

# Release builds ship arm64-v8a only. x86_64 is included for the emulator;
# debug builds keep both so development works without a physical device.
reactNativeArchitectures=arm64-v8a,x86_64

newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# AGP 9 opt-outs used by the RN 0.88 template.
android.builtInKotlin=false
android.newDsl=false
