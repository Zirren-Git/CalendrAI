apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

/**
 * Isolated build for llama.cpp. CPU inference only: no CUDA/Metal/Vulkan, which
 * keeps the APK small and the behaviour predictable on phones.
 */
android {
    namespace "com.dayloom.llama"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-O3 -DNDEBUG -fexceptions -frtti"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version rootProject.ext.cmakeVersion
        }
    }

    buildTypes {
        release {
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}
